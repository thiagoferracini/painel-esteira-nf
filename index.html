<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esteira NF Combustível</title>
<style>
  :root {
    --verde: #1F6B3C;
    --verde-escuro: #164E2B;
    --verde-claro: #E8F3EC;
    --amarelo: #FFF8E5;
    --amarelo-texto: #8A6100;
    --vermelho: #FCEBEB;
    --vermelho-texto: #A32D2D;
    --azul: #E6F1FB;
    --azul-texto: #185FA5;
    --roxo: #EEEDFE;
    --roxo-texto: #4A3F9C;
    --cinza-chip: #EFEFEF;
    --cinza-chip-texto: #555555;
    --cinza-bg: #F5F6F5;
    --cinza-borda: #DDDDDD;
    --texto: #222222;
    --texto-sec: #5B5B5B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--cinza-bg);
    color: var(--texto);
  }
  header {
    background: var(--verde);
    color: white;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  header .user-box {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }
  header .user-box button {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  header .user-box button:hover { background: rgba(255,255,255,0.25); }

  .tabs {
    display: flex;
    background: white;
    border-bottom: 1px solid var(--cinza-borda);
    padding: 0 24px;
  }
  .tab {
    padding: 14px 20px;
    cursor: pointer;
    color: var(--texto-sec);
    font-size: 14px;
    font-weight: 500;
    border-bottom: 3px solid transparent;
  }
  .tab.active {
    color: var(--verde);
    border-bottom-color: var(--verde);
  }
  .tab .badge {
    background: var(--verde-claro);
    color: var(--verde-escuro);
    border-radius: 10px;
    padding: 1px 8px;
    font-size: 12px;
    margin-left: 6px;
  }

  main { max-width: 960px; margin: 0 auto; padding: 24px; }

  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    align-items: center;
  }
  .toolbar input[type=text] {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--cinza-borda);
    border-radius: 8px;
    font-size: 14px;
  }
  .toolbar button.refresh {
    background: white;
    border: 1px solid var(--cinza-borda);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    color: var(--texto-sec);
  }
  .toolbar button.refresh:hover { background: var(--cinza-bg); }

  .card {
    background: white;
    border: 1px solid var(--cinza-borda);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .card .info { flex: 1; min-width: 0; }
  .card .info .titulo {
    font-weight: 600;
    font-size: 15px;
    margin: 0 0 4px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .info .sub {
    font-size: 13px;
    color: var(--texto-sec);
    margin: 0;
  }
  .card .acoes { display: flex; gap: 8px; flex-shrink: 0; }
  .card input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
  .btn-voltar { background: transparent; color: var(--texto-sec); border: 1px solid var(--cinza-borda); }
  .btn-voltar:hover { background: var(--cinza-bg); }

  .btn {
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
  }
  .btn-primary { background: var(--verde); color: white; }
  .btn-primary:hover { background: var(--verde-escuro); }
  .btn-secondary { background: var(--verde-claro); color: var(--verde-escuro); }
  .btn-secondary:hover { background: #D5E9DD; }
  .btn-success { background: var(--verde-claro); color: var(--verde-escuro); }
  .btn-danger { background: var(--vermelho); color: var(--vermelho-texto); }
  .btn-warning { background: var(--amarelo); color: var(--amarelo-texto); }
  .btn-roxo { background: var(--roxo); color: var(--roxo-texto); }
  .btn-cinza { background: var(--cinza-chip); color: var(--cinza-chip-texto); }
  .btn-ghost { background: transparent; color: var(--texto-sec); border: 1px solid var(--cinza-borda); }
  .btn-download { background: transparent; color: var(--verde); border: 1px solid var(--verde-claro); }
  .btn-download:hover { background: var(--verde-claro); }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--texto-sec);
  }
  .empty .icone { font-size: 40px; margin-bottom: 12px; }

  .badge-formato {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--azul);
    color: var(--azul-texto);
    margin-left: 6px;
  }

  .badge-decisao {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .badge-decisao.match_automatico { background: var(--verde-claro); color: var(--verde-escuro); }
  .badge-decisao.sem_candidato { background: var(--cinza-chip); color: var(--cinza-chip-texto); }
  .badge-decisao.ambiguo { background: var(--amarelo); color: var(--amarelo-texto); }
  .badge-decisao.sem_cliente { background: var(--cinza-chip); color: var(--cinza-chip-texto); }
  .badge-decisao.erro_webrouter { background: var(--vermelho); color: var(--vermelho-texto); }
  .badge-decisao.erro_interno { background: var(--vermelho); color: var(--vermelho-texto); }

  .badge-sombra {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--roxo);
    color: var(--roxo-texto);
    margin-left: 6px;
  }
  .badge-ao-vivo {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    background: var(--azul);
    color: var(--azul-texto);
    margin-left: 6px;
  }

  .conciliacao-card {
    background: white;
    border: 1px solid var(--cinza-borda);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 10px;
  }
  .conciliacao-card .topo {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
  }
  .conciliacao-card .titulo {
    font-weight: 600;
    font-size: 15px;
    margin: 0 0 4px 0;
  }
  .conciliacao-card .sub {
    font-size: 13px;
    color: var(--texto-sec);
    margin: 0;
  }
  .conciliacao-card .criterios {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--cinza-borda);
    font-size: 12px;
    color: var(--texto-sec);
    white-space: pre-wrap;
    word-break: break-word;
    font-family: 'SF Mono', Monaco, monospace;
    background: var(--cinza-bg);
    padding: 10px;
    border-radius: 6px;
  }
  .conciliacao-card.expandido .criterios { display: block; }
  .conciliacao-card .ver-detalhes {
    font-size: 12px;
    color: var(--azul-texto);
    margin-top: 6px;
    display: inline-block;
  }

  #login-screen {
    max-width: 400px;
    margin: 80px auto;
    background: white;
    border-radius: 12px;
    padding: 32px;
    border: 1px solid var(--cinza-borda);
    text-align: center;
  }
  #login-screen h2 { margin-top: 0; font-size: 18px; }

  .logo-login {
    display: block;
    max-width: 160px;
    height: auto;
    margin: 0 auto 16px auto;
  }
  header .logo-header {
    height: 28px;
    width: auto;
    display: block;
  }
  header h1 {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .visao-geral { text-align: left; margin: 20px 0 28px 0; }
  .visao-geral-cabecalho {
    font-size: 13px;
    color: var(--texto-sec);
    margin: 0 0 12px 0;
    text-transform: capitalize;
  }
  .visao-geral-titulo { color: var(--texto-sec); font-size: 13px; }
  .visao-geral-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }
  .analista-overview-card {
    background: var(--cinza-bg);
    border: 1px solid var(--cinza-borda);
    border-radius: 10px;
    padding: 14px 16px;
    text-align: left;
  }
  .analista-overview-card .nome {
    font-weight: 600;
    font-size: 14px;
    margin: 0 0 8px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .analista-overview-card .stat-linha {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--texto-sec);
    margin: 3px 0;
  }
  .analista-overview-card .stat-linha strong { color: var(--texto); font-weight: 600; }

  .login-form {
    width: 100%;
  }
  .login-form select,
  .login-form input[type=email],
  .login-form input[type=password] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--cinza-borda);
    font-size: 14px;
    margin: 16px 0;
    font-family: inherit;
    box-sizing: border-box;
  }
  .login-form button {
    width: 100%;
    padding: 12px;
    background: var(--verde);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }

  .overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 12px;
    padding: 24px;
    width: 90%;
    max-width: 420px;
  }
  .modal h3 { margin-top: 0; font-size: 16px; }
  .modal select, .modal textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--cinza-borda);
    font-size: 14px;
    margin: 10px 0;
  }
  .modal .modal-acoes {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 16px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--texto);
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  #app { display: none; }
</style>
</head>

<script>
const SUPABASE_URL = 'https://qzoybfofmhrzblujplgo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6b3liZm9mbWhyemJsdWpwbGdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4Mjg5MzcsImV4cCI6MjEwMDQwNDkzN30.zi7g6iZbKU_2GUe0pq1reccisvy6F8-Rb6MmU0Gdwok';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SHAREPOINT_BASE_URL = 'https://ailogcombr598.sharepoint.com';

let analistaAtual = null;
let analistasCache = [];
let notaParaAtribuir = null;
let abaAtual = 'fila';
let selecionadas = new Set();

// Monta a URL de download de um arquivo no SharePoint a partir do caminho salvo no Supabase.
// Faz duas correções em relação a montar a URL "na unha":
// 1) Codifica cada segmento do caminho (espaços, acentos, etc.) sem tocar nas barras "/",
//    porque caminho_arquivo costuma conter nomes de pasta com espaço (ex: "Arthur Ribas").
// 2) Adiciona ?download=1, que força o navegador a baixar o arquivo em vez de tentar abrir
//    o visualizador do SharePoint (que não sabe pré-visualizar .xml e dá erro).
function montarUrlDownload(caminhoArquivo) {
  if (!caminhoArquivo) return '';
  const caminhoCodificado = caminhoArquivo
    .split('/')
    .map(parte => encodeURIComponent(parte))
    .join('/');
  return `${SHAREPOINT_BASE_URL}${caminhoCodificado}?download=1`;
}

function linkDownload(n) {
  if (!n.caminho_arquivo) return '';
  const url = montarUrlDownload(n.caminho_arquivo);
  // Sem target="_blank": como agora o link força download (não navegação),
  // manter target="_blank" só abriria uma aba em branco a cada clique.
  return `<a class="btn btn-download" href="${url}" rel="noopener" title="Baixar o arquivo original do SharePoint">Baixar arquivo</a>`;
}

function nomeEscapado(n) {
  return (n.nome_emitente || n.numero_nf || '').replace(/'/g, "\\'");
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function limparCnpj(texto) {
  return (texto || '').replace(/\D/g, '');
}

// Filtra uma lista de notas por nome do emitente ou CNPJ, a partir de um termo digitado.
function filtrarPorBusca(lista, termo) {
  const termoTrim = (termo || '').trim();
  if (!termoTrim) return lista;
  const termoLimpo = limparCnpj(termoTrim);
  const termoLower = termoTrim.toLowerCase();
  return lista.filter(n => {
    const cnpjBate = termoLimpo.length >= 3 && (n.cnpj_emitente || '').includes(termoLimpo);
    const nomeBate = (n.nome_emitente || '').toLowerCase().includes(termoLower);
    return cnpjBate || nomeBate;
  });
}

// Monta a linha de e-mails (remetente e/ou analista responsável), só exibindo o que existir.
function linhaEmails(n) {
  const partes = [];
  if (n.remetente_email) partes.push(`De: ${n.remetente_email}`);
  const emailAnalista = n.analistas && n.analistas.email;
  if (emailAnalista) partes.push(`Analista: ${emailAnalista}`);
  if (partes.length === 0) return '';
  return `<p class="sub">${partes.join(' · ')}</p>`;
}

function formatarCnpj(cnpj) {
  if (!cnpj || cnpj.length !== 14) return cnpj || '';
  return cnpj.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
}

function formatarMoeda(valor) {
  if (valor === null || valor === undefined) return '';
  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatarData(dataStr) {
  if (!dataStr) return '';
  const d = new Date(dataStr);
  return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

// Retorna o início do mês corrente em ISO, usado como filtro de data_recebimento
// para a visão geral por analista (sempre "mês atual", recalculado a cada carregamento).
function inicioMesAtualISO() {
  const agora = new Date();
  return new Date(agora.getFullYear(), agora.getMonth(), 1, 0, 0, 0).toISOString();
}

// Agrupa uma lista de notas por analista_id, somando/contando os quatro indicadores dos cards.
// Cada nota conta como 1 "e-mail" (é a unidade que já temos no schema hoje).
function agregarNotasPorAnalista(notas) {
  const mapa = {};
  notas.forEach(n => {
    const chave = n.analista_id || 'sem_analista';
    if (!mapa[chave]) mapa[chave] = { emails: 0, valorTotal: 0, totalXml: 0, totalPdf: 0 };
    mapa[chave].emails += 1;
    mapa[chave].valorTotal += Number(n.valor_nf) || 0;
    if (n.formato_anexo === 'XML') mapa[chave].totalXml += 1;
    if (n.formato_anexo === 'PDF') mapa[chave].totalPdf += 1;
  });
  return mapa;
}

// Carrega e renderiza a Visão Geral dentro do app (aba própria, pós-login).
// Admin vê um card por analista ativo; analista comum vê só o seu próprio card.
// A consulta já é protegida por RLS no banco, mas filtramos aqui também por
// clareza e para reduzir dados trafegados quando não é admin.
async function carregarVisaoGeralApp() {
  const container = document.getElementById('visao-geral-app');
  const admin = analistaAtual && analistaAtual.role === 'admin';

  let query = supabaseClient
    .from('notas')
    .select('analista_id, valor_nf, formato_anexo')
    .gte('data_recebimento', inicioMesAtualISO());

  if (!admin) {
    query = query.eq('analista_id', analistaAtual.id);
  }

  const { data, error } = await query;
  if (error) {
    console.error(error);
    container.innerHTML = '<p class="visao-geral-titulo">Não foi possível carregar a visão geral do mês.</p>';
    return;
  }

  const agregados = agregarNotasPorAnalista(data);
  const nomeMes = new Date().toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

  if (admin) {
    const ativos = analistasCache.filter(a => a.ativo);
    if (ativos.length === 0) {
      container.innerHTML = '<p class="visao-geral-titulo">Nenhum analista ativo cadastrado.</p>';
      return;
    }
    const cards = ativos.map(a => {
      const stats = agregados[a.id] || { emails: 0, valorTotal: 0, totalXml: 0, totalPdf: 0 };
      return `
        <div class="analista-overview-card">
          <p class="nome">${a.nome}</p>
          <div class="stat-linha"><span>E-mails recebidos</span><strong>${stats.emails}</strong></div>
          <div class="stat-linha"><span>Valor total</span><strong>${formatarMoeda(stats.valorTotal)}</strong></div>
          <div class="stat-linha"><span>XML</span><strong>${stats.totalXml}</strong></div>
          <div class="stat-linha"><span>PDF</span><strong>${stats.totalPdf}</strong></div>
        </div>
      `;
    }).join('');
    container.innerHTML = `
      <p class="visao-geral-cabecalho">Visão geral · ${nomeMes} · todos os analistas</p>
      <div class="visao-geral-grid">${cards}</div>
    `;
  } else {
    const stats = agregados[analistaAtual.id] || { emails: 0, valorTotal: 0, totalXml: 0, totalPdf: 0 };
    container.innerHTML = `
      <p class="visao-geral-cabecalho">Seu resumo · ${nomeMes}</p>
      <div class="visao-geral-grid">
        <div class="analista-overview-card">
          <p class="nome">${analistaAtual.nome}</p>
          <div class="stat-linha"><span>E-mails recebidos</span><strong>${stats.emails}</strong></div>
          <div class="stat-linha"><span>Valor total</span><strong>${formatarMoeda(stats.valorTotal)}</strong></div>
          <div class="stat-linha"><span>XML</span><strong>${stats.totalXml}</strong></div>
          <div class="stat-linha"><span>PDF</span><strong>${stats.totalPdf}</strong></div>
        </div>
      </div>
    `;
  }
}

// Autentica com e-mail + senha (contas criadas previamente via Admin API).
// Diferente do link mágico, a sessão já vem pronta na resposta — sem precisar
// esperar redirecionamento nem depender de envio de e-mail.
async function fazerLoginSenha() {
  const email = document.getElementById('input-email-login').value.trim();
  const senha = document.getElementById('input-senha-login').value;
  if (!email || !senha) { mostrarToast('Preencha e-mail e senha.'); return; }

  const btn = document.getElementById('btn-entrar');
  btn.disabled = true;
  btn.textContent = 'Entrando...';

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });

  btn.disabled = false;
  btn.textContent = 'Entrar';

  if (error) {
    console.error(error);
    mostrarToast('E-mail ou senha incorretos.');
    return;
  }

  await tentarEntrarComSessao(data.session);
}

// Depois que o login por senha confirma a sessão, busca o registro
// correspondente em `analistas` pelo e-mail da sessão. Se não achar (ou estiver
// inativo), a pessoa está autenticada mas não é um analista válido — desloga.
async function tentarEntrarComSessao(session) {
  if (!session || !session.user || !session.user.email) return false;
  const emailSessao = session.user.email;

  const { data, error } = await supabaseClient
    .from('analistas')
    .select('id, nome, display_name, ativo, role, email')
    .ilike('email', emailSessao)
    .maybeSingle();

  if (error) { console.error(error); return false; }

  if (!data || !data.ativo) {
    mostrarToast('Seu e-mail não está cadastrado como analista ativo. Fale com o administrador.');
    await supabaseClient.auth.signOut();
    return false;
  }

  analistaAtual = data;
  entrarNoApp();
  return true;
}

let filaCache = [];

async function carregarFila() {
  const { data, error } = await supabaseClient
    .from('notas')
    .select('*, analistas(nome, email, display_name)')
    .eq('status', '01_nova')
    .order('data_recebimento', { ascending: true });
  if (error) { console.error(error); mostrarToast('Erro ao carregar a fila.'); return; }
  filaCache = data;
  document.getElementById('badge-fila').textContent = data.length;
  renderFila();
}

function renderFila() {
  const termo = document.getElementById('busca-fila').value;
  const lista = filtrarPorBusca(filaCache, termo);

  const container = document.getElementById('lista-fila');
  if (lista.length === 0) {
    container.innerHTML = termo
      ? `<div class="empty"><div class="icone">🔍</div>Nenhuma nota encontrada para "${termo}".</div>`
      : `<div class="empty"><div class="icone">📭</div>Nenhuma nota pendente na fila.</div>`;
    return;
  }

  container.innerHTML = lista.map(n => `
    <div class="card">
      <div class="info">
        <p class="titulo">${n.nome_emitente || n.numero_nf || 'Sem identificação'}<span class="badge-formato">${n.formato_anexo || ''}</span></p>
        <p class="sub">${n.cnpj_emitente ? 'CNPJ: ' + formatarCnpj(n.cnpj_emitente) + ' · ' : ''}${n.valor_nf ? formatarMoeda(n.valor_nf) + ' · ' : ''}Chegou: ${formatarData(n.data_recebimento)}</p>
        ${linhaEmails(n)}
      </div>
      <div class="acoes">
        ${linkDownload(n)}
        <button class="btn btn-secondary" onclick="pegarNota('${n.id}')">Pegar</button>
        <button class="btn btn-ghost" onclick="abrirAtribuir('${n.id}', '${nomeEscapado(n)}')">Atribuir</button>
      </div>
    </div>
  `).join('');
}

async function pegarNota(id) {
  const { data, error } = await supabaseClient
    .from('notas')
    .update({ analista_id: analistaAtual.id, status: '02_em_analise', sharepoint_sincronizado: false })
    .eq('id', id)
    .eq('status', '01_nova')
    .select();
  if (error) { console.error(error); mostrarToast('Erro ao pegar a nota.'); return; }
  if (!data || data.length === 0) { mostrarToast('Ops, outro analista pegou essa nota primeiro.'); carregarFila(); return; }

  const cnpj = data[0].cnpj_emitente;
  if (cnpj) {
    const { data: carteiraExistente } = await supabaseClient
      .from('carteira_cnpj')
      .select('id')
      .eq('cnpj', cnpj)
      .maybeSingle();
    if (!carteiraExistente) {
      await supabaseClient.from('carteira_cnpj').insert({ cnpj, analista_id: analistaAtual.id });
      mostrarToast('Nota atribuída a você! Posto adicionado à sua carteira.');
    } else {
      mostrarToast('Nota atribuída a você!');
    }
  } else {
    mostrarToast('Nota atribuída a você!');
  }
  carregarFila();
  carregarAConciliar();
}

function abrirAtribuir(id, nome) {
  notaParaAtribuir = id;
  document.getElementById('atribuir-nome-nota').textContent = `Nota: ${nome}`;
  document.getElementById('select-atribuir-analista').value = '';
  document.getElementById('overlay-atribuir').classList.add('show');
}

function fecharModal(idOverlay) {
  document.getElementById(idOverlay).classList.remove('show');
}

async function confirmarAtribuicao() {
  const analistaId = document.getElementById('select-atribuir-analista').value;
  if (!analistaId) { mostrarToast('Selecione um analista.'); return; }
  const analista = analistasCache.find(a => a.id === analistaId);

  const { data, error } = await supabaseClient
    .from('notas')
    .update({ analista_id: analistaId, status: '02_em_analise', sharepoint_sincronizado: false })
    .eq('id', notaParaAtribuir)
    .eq('status', '01_nova')
    .select();
  if (error) { console.error(error); mostrarToast('Erro ao atribuir a nota.'); return; }
  if (!data || data.length === 0) { mostrarToast('Ops, essa nota já foi pega por alguém.'); fecharModal('overlay-atribuir'); carregarFila(); return; }

  const cnpj = data[0].cnpj_emitente;
  if (cnpj) {
    const { data: carteiraExistente } = await supabaseClient
      .from('carteira_cnpj')
      .select('id')
      .eq('cnpj', cnpj)
      .maybeSingle();
    if (!carteiraExistente) {
      await supabaseClient.from('carteira_cnpj').insert({ cnpj, analista_id: analistaId });
    }
  }

  mostrarToast(`Nota atribuída a ${analista.nome}!`);
  fecharModal('overlay-atribuir');
  carregarFila();
}

let conciliarCache = [];

async function carregarAConciliar() {
  if (!analistaAtual) return;
  const { data, error } = await supabaseClient
    .from('notas')
    .select('*, analistas(nome, email, display_name)')
    .eq('status', '02_em_analise')
    .eq('analista_id', analistaAtual.id)
    .order('data_recebimento', { ascending: true });
  if (error) { console.error(error); mostrarToast('Erro ao carregar suas notas.'); return; }
  conciliarCache = data;
  document.getElementById('badge-conciliar').textContent = data.length;
  selecionadas = new Set([...selecionadas].filter(id => data.some(n => n.id === id)));
  renderAConciliar();
}

function renderAConciliar() {
  const termo = document.getElementById('busca-conciliar').value;
  const lista = filtrarPorBusca(conciliarCache, termo);

  const container = document.getElementById('lista-conciliar');
  if (lista.length === 0) {
    container.innerHTML = termo
      ? `<div class="empty"><div class="icone">🔍</div>Nenhuma nota encontrada para "${termo}".</div>`
      : `<div class="empty"><div class="icone">✅</div>Você não tem notas a conciliar no momento.</div>`;
    atualizarBotaoBaixarSelecionadas();
    return;
  }
  container.innerHTML = lista.map(n => `
    <div class="card">
      <input type="checkbox" data-id="${n.id}" ${selecionadas.has(n.id) ? 'checked' : ''} onchange="alternarSelecao('${n.id}', this.checked)">
      <div class="info">
        <p class="titulo">${n.nome_emitente || n.numero_nf || 'Sem identificação'}<span class="badge-formato">${n.formato_anexo || ''}</span></p>
        <p class="sub">${n.cnpj_emitente ? 'CNPJ: ' + formatarCnpj(n.cnpj_emitente) + ' · ' : ''}${n.valor_nf ? formatarMoeda(n.valor_nf) + ' · ' : ''}Chegou: ${formatarData(n.data_recebimento)}</p>
        ${linhaEmails(n)}
      </div>
      <div class="acoes">
        <button class="btn btn-primary" onclick="baixarEConciliar(['${n.id}'])">Baixar e conciliar</button>
      </div>
    </div>
  `).join('');
  atualizarBotaoBaixarSelecionadas();
}

function alternarSelecao(id, marcado) {
  if (marcado) selecionadas.add(id); else selecionadas.delete(id);
  atualizarBotaoBaixarSelecionadas();
}

function marcarTodos(marcado) {
  const termo = document.getElementById('busca-conciliar').value;
  const visiveis = filtrarPorBusca(conciliarCache, termo);
  if (marcado) {
    visiveis.forEach(n => selecionadas.add(n.id));
  } else {
    visiveis.forEach(n => selecionadas.delete(n.id));
  }
  renderAConciliar();
}

function atualizarBotaoBaixarSelecionadas() {
  const btn = document.getElementById('btn-baixar-selecionadas');
  btn.textContent = `Baixar selecionadas (${selecionadas.size})`;
  btn.disabled = selecionadas.size === 0;
}

function baixarSelecionadas() {
  baixarEConciliar([...selecionadas]);
}

async function baixarEConciliar(ids) {
  const notas = conciliarCache.filter(n => ids.includes(n.id));
  const semArquivo = notas.filter(n => !n.caminho_arquivo);

  notas.forEach((n, i) => {
    if (!n.caminho_arquivo) return;
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = montarUrlDownload(n.caminho_arquivo);
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, i * 400);
  });

  const { error } = await supabaseClient
    .from('notas')
    .update({ status: '03_processada', data_conclusao: new Date().toISOString() })
    .in('id', ids);
  if (error) { console.error(error); mostrarToast('Erro ao marcar como conciliado.'); return; }

  selecionadas.clear();
  const msg = semArquivo.length > 0
    ? `${ids.length} nota(s) marcada(s) como conciliada(s). ${semArquivo.length} sem arquivo para baixar.`
    : `${ids.length} nota(s) baixada(s) e marcada(s) como conciliada(s)!`;
  mostrarToast(msg);
  carregarAConciliar();
  carregarConciliado();
}

let conciliadoCache = [];

async function carregarConciliado() {
  if (!analistaAtual) return;
  const { data, error } = await supabaseClient
    .from('notas')
    .select('*, analistas(nome, email, display_name)')
    .eq('status', '03_processada')
    .eq('analista_id', analistaAtual.id)
    .order('data_conclusao', { ascending: false })
    .limit(200);
  if (error) { console.error(error); mostrarToast('Erro ao carregar notas conciliadas.'); return; }
  conciliadoCache = data;
  document.getElementById('badge-conciliado').textContent = data.length;
  renderConciliado();
}

function renderConciliado() {
  const termo = document.getElementById('busca-conciliado').value;
  const lista = filtrarPorBusca(conciliadoCache, termo);

  const container = document.getElementById('lista-conciliado');
  if (lista.length === 0) {
    container.innerHTML = termo
      ? `<div class="empty"><div class="icone">🔍</div>Nenhuma nota encontrada para "${termo}".</div>`
      : `<div class="empty"><div class="icone">📂</div>Nenhuma nota conciliada ainda.</div>`;
    return;
  }
  container.innerHTML = lista.map(n => `
    <div class="card">
      <div class="info">
        <p class="titulo">${n.nome_emitente || n.numero_nf || 'Sem identificação'}<span class="badge-formato">${n.formato_anexo || ''}</span></p>
        <p class="sub">${n.cnpj_emitente ? 'CNPJ: ' + formatarCnpj(n.cnpj_emitente) + ' · ' : ''}Conciliado em: ${formatarData(n.data_conclusao)}</p>
        ${linhaEmails(n)}
      </div>
      <div class="acoes">
        ${linkDownload(n)}
        <button class="btn btn-voltar" onclick="voltarParaConciliar('${n.id}')">Voltar</button>
      </div>
    </div>
  `).join('');
}

async function voltarParaConciliar(id) {
  const { error } = await supabaseClient
    .from('notas')
    .update({ status: '02_em_analise', data_conclusao: null })
    .eq('id', id);
  if (error) { console.error(error); mostrarToast('Erro ao voltar a nota.'); return; }
  mostrarToast('Nota voltou para "A conciliar".');
  carregarAConciliar();
  carregarConciliado();
}

function escaparHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto;
  return div.innerHTML;
}

let conciliacaoLogCache = [];

const LABEL_DECISAO = {
  match_automatico: 'Conciliado automaticamente',
  sem_candidato: 'Sem candidato',
  ambiguo: 'Ambíguo',
  sem_cliente: 'Cliente não resolvido',
  erro_webrouter: 'Erro no webrouter',
  erro_interno: 'Erro interno',
};

// Carrega o histórico de decisões da conciliação automática (tabela conciliacao_log),
// já trazendo os dados da nota relacionada via join. O RLS já restringe: analista comum
// só recebe linhas ligadas às próprias notas; admin recebe tudo.
async function carregarConciliacaoLog() {
  const container = document.getElementById('lista-conciliacao-auto');
  const { data, error } = await supabaseClient
    .from('conciliacao_log')
    .select('*, notas(nome_emitente, numero_nf, cnpj_emitente, valor_nf, analistas(nome))')
    .order('created_at', { ascending: false })
    .limit(200);

  if (error) {
    console.error(error);
    container.innerHTML = '<div class="empty"><div class="icone">⚠️</div>Não foi possível carregar o histórico de conciliação.</div>';
    return;
  }

  conciliacaoLogCache = data;
  renderConciliacaoLog();
}

function renderConciliacaoLog() {
  const filtroDecisao = document.getElementById('filtro-decisao-conciliacao').value;
  const ocultarSombra = document.getElementById('check-ocultar-sombra').checked;

  let lista = conciliacaoLogCache;
  if (filtroDecisao) lista = lista.filter(l => l.decisao === filtroDecisao);
  if (ocultarSombra) lista = lista.filter(l => !l.modo_sombra);

  const container = document.getElementById('lista-conciliacao-auto');
  if (lista.length === 0) {
    container.innerHTML = '<div class="empty"><div class="icone">🤖</div>Nenhum registro de conciliação automática ainda.</div>';
    return;
  }

  container.innerHTML = lista.map((l, i) => {
    const nota = l.notas || {};
    const nomeAnalista = nota.analistas && nota.analistas.nome;
    const labelDecisao = LABEL_DECISAO[l.decisao] || l.decisao;
    const criteriosTexto = escaparHtml(l.criterios ? JSON.stringify(l.criterios, null, 2) : '(sem detalhes registrados)');
    const idCard = `conc-log-${i}`;
    return `
      <div class="conciliacao-card" id="${idCard}">
        <div class="topo" onclick="alternarDetalhesConciliacao('${idCard}')">
          <div class="info">
            <p class="titulo">
              ${nota.nome_emitente || nota.numero_nf || 'Nota não identificada'}
              <span class="badge-decisao ${l.decisao}">${labelDecisao}</span>
              ${l.modo_sombra ? '<span class="badge-sombra">Simulação</span>' : '<span class="badge-ao-vivo">Ao vivo</span>'}
            </p>
            <p class="sub">
              ${nota.valor_nf ? formatarMoeda(nota.valor_nf) + ' · ' : ''}
              ${nomeAnalista ? 'Analista: ' + nomeAnalista + ' · ' : ''}
              ${l.transacao_id ? 'Transação: ' + l.transacao_id + ' · ' : ''}
              ${formatarData(l.created_at)}
            </p>
            <span class="ver-detalhes">Ver critérios da decisão ▾</span>
          </div>
        </div>
        <div class="criterios">${criteriosTexto}</div>
      </div>
    `;
  }).join('');
}

function alternarDetalhesConciliacao(idCard) {
  document.getElementById(idCard).classList.toggle('expandido');
}

function iniciarRealtime() {
  supabaseClient
    .channel('notas-mudancas')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'notas' }, () => {
      carregarFila();
      carregarAConciliar();
      carregarConciliado();
    })
    .subscribe();
}

(async function init() {
  await carregarAnalistas();
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    await tentarEntrarComSessao(session);
  }
})();
</script>
</body>
</html>
